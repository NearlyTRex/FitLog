# Example deployment behind a reverse proxy on 127.0.0.1. The app clones its
# catalog into the catalog volume on first start and pulls it on a timer.
services:
  fitlog:
    build: .
    container_name: fitlog
    restart: always
    ports:
      - "127.0.0.1:${FITLOG_PORT:-8000}:8000"
    environment:
      FITLOG_CATALOG_URL: https://github.com/NearlyTRex/FitLog.git
      FITLOG_TIMEZONE: ${FITLOG_TIMEZONE:-America/Los_Angeles}
      FITLOG_PULL_MINUTES: ${FITLOG_PULL_MINUTES:-10}
    volumes:
      - state:/data
      - catalog:/catalog

volumes:
  state:
  catalog:
