[project]
name = "fitlog"
version = "0.1.0"
description = "Personal food and exercise tracker driven by a git catalog"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fitlog = "fitlog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fitlog*"]

[tool.setuptools.package-data]
fitlog = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
