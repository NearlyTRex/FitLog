name: release

# Tags and publishes whatever version pyproject.toml holds, once. Pushes that
# don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: read
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Check for tag
        id: tag
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/check.yml

  release:
    needs: [version, check]
    runs-on: ubuntu-latest
    steps:
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" --repo "$REPO" --target "$SHA" \
            --title "FitLog $VERSION" --generate-notes
