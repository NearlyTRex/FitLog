name: release

# Tags and publishes the version in pyproject.toml once, after the checks pass.
# Pushes that don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@9ae8672e35efbf74b2c8dfe70e959ae775fb1e07 # 9ae8672
    permissions:
      contents: read
    with:
      commands: fitlog check data

  release:
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@9ae8672e35efbf74b2c8dfe70e959ae775fb1e07 # 9ae8672
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
