name: Release

# Tags and publishes the version in pyproject.toml once, after the checks pass.
# Pushes that don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@45bf3d2ed784d826f7951b407631311bce30d435 # v0.2.14
    permissions:
      contents: read
    with:
      commands: fitlog check data

  release:
    name: Release
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@45bf3d2ed784d826f7951b407631311bce30d435 # v0.2.14
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
