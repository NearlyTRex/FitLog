name: release

# Tags and publishes the version in pyproject.toml once, after the checks pass.
# Pushes that don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: read
    with:
      commands: fitlog check data

  release:
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
