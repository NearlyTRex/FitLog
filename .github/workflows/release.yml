name: Release

# Tags and publishes the version in pyproject.toml once, after the checks pass.
# Pushes that don't change the version find the tag already there and do nothing.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      contents: read
    with:
      commands: fitlog check data

  release:
    name: Release
    needs: check
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
