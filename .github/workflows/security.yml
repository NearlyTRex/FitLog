name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      contents: read
    with:
      pip-audit-files: requirements-dev.txt requirements.txt

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      contents: read

  container-scan:
    name: Container Scan
    uses: NearlyTRex/Workflows/.github/workflows/container-scan.yml@5afc5d2c4f534e1fb7daa83a4df2808063c8fa08 # v0.2.1
    permissions:
      contents: read
    with:
      dockerfile: Dockerfile
      context: .
