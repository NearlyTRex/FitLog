name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
    with:
      pip-audit-files: requirements-dev.txt requirements.txt

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read

  container-scan:
    name: Container Scan
    uses: NearlyTRex/Workflows/.github/workflows/container-scan.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
    with:
      dockerfile: Dockerfile
      context: .
      config-scan: true
