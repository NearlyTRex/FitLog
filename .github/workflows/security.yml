name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: read
    with:
      pip-audit-files: requirements-dev.txt requirements.txt

  codeql:
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python", "actions"]'

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: read

  container-scan:
    uses: NearlyTRex/Workflows/.github/workflows/container-scan.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: read
    with:
      dockerfile: Dockerfile
      context: .
