name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
    with:
      commands: fitlog check data

  compose:
    name: Compose (compose.yaml)
    uses: NearlyTRex/Workflows/.github/workflows/compose-test.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
    with:
      compose-file: compose.yaml
      health-url: http://127.0.0.1:8000/login

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@a312ddd3b1f067963e825ffbab2cae8f82f6dcb1 # v0.2.29
    permissions:
      contents: read
