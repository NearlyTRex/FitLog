name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@45bf3d2ed784d826f7951b407631311bce30d435 # v0.2.14
    permissions:
      contents: read
    with:
      commands: fitlog check data

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@45bf3d2ed784d826f7951b407631311bce30d435 # v0.2.14
    permissions:
      contents: read
