name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      commands: fitlog check data

  compose:
    name: Compose (compose.yaml)
    uses: NearlyTRex/Workflows/.github/workflows/compose-test.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      compose-file: compose.yaml
      health-url: http://127.0.0.1:8000/login

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
