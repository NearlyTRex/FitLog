name: prepare release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@765a25c08b845e12087b32a969dc11d5896f8e0e # v0.2.0
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: pyproject.toml
