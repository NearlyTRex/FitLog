name: prepare release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@9ae8672e35efbf74b2c8dfe70e959ae775fb1e07 # 9ae8672
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: pyproject.toml
