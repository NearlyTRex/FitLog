name: Glute Bridge
type: strength
prescription: 3 sets of 15 reps
minutes: 5
muscles: [glutes, hamstrings]
steps:
  - Lie on your back with knees bent and feet flat on the floor, hip width apart.
  - Rest your arms by your sides, palms down.
  - Press through your heels and lift your hips until your body forms a straight line from shoulders to knees.
  - Squeeze your glutes hard at the top for two seconds.
  - Lower your hips slowly back to the floor.
tips:
  - Hold a dumbbell across your hips to make it harder.
