name: Deadlift (Kettlebell)
type: strength
prescription: 3 sets of 15 reps
minutes: 6
muscles: [hamstrings, glutes, back]
equipment: [kettlebell]
steps:
  - Stand with feet hip width apart, the kettlebell on the floor between your feet.
  - Push your hips back and bend your knees to reach the handle with both hands, back flat.
  - Keep your arms long in front of you and your wrists straight.
  - Stand up by driving your hips forward, lifting the kettlebell to hip height.
  - Lower it back to the floor by pushing your hips back again.
tips:
  - The arms just hold the weight; the lift comes from your hips and legs.
