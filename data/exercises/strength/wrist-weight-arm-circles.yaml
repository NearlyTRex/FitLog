name: Arm Circles (Wrist Weights)
type: strength
prescription: "3 rounds of 30 seconds forward, 30 seconds backward"
minutes: 5
muscles: [shoulders]
equipment: [wrist weights]
steps:
  - Strap on the wrist weights and stand with feet shoulder width apart.
  - Raise your arms straight out to your sides at shoulder height.
  - Make small circles forward for 30 seconds.
  - Reverse and make circles backward for 30 seconds.
  - Lower your arms and rest before the next round.
