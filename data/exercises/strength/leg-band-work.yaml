name: Leg Resistance Band Work
type: strength
prescription: 3 sets of 15 reps per leg
minutes: 8
muscles: [outer hips, glutes]
equipment: [resistance band]
steps:
  - Put the resistance band around both legs.
  - Stand tall, holding a chair or wall for balance if needed.
  - Open the working leg out to the side against the band.
  - Bring it back in slowly without letting the band snap it back.
  - Finish the set, then switch to the other leg.
