name: Goblet Squat
type: strength
prescription: 3 sets of 10-12 reps
minutes: 6
muscles: [quads, glutes, core]
equipment: [dumbbell or kettlebell]
steps:
  - Hold one dumbbell vertically against your chest, both hands cupping the top end.
  - Stand with feet slightly wider than hip width, toes turned out a little.
  - Brace your core, then push your hips back and bend your knees to lower.
  - Sink until your thighs are at least parallel, elbows tracking inside your knees.
  - Drive through your whole foot to stand back up, squeezing your glutes at the top.
tips:
  - Keep your chest tall and the weight close to your body.
  - Knees should travel in the same direction as your toes.
