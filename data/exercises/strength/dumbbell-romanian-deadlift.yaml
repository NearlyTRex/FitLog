name: Dumbbell Romanian Deadlift
type: strength
prescription: 3 sets of 10 reps
minutes: 6
muscles: [hamstrings, glutes, lower back]
equipment: [dumbbells]
steps:
  - Stand tall holding a dumbbell in each hand in front of your thighs.
  - Soften your knees slightly and keep them at that bend throughout.
  - Push your hips straight back, sliding the dumbbells down the front of your legs.
  - Lower until you feel a strong stretch in your hamstrings, usually just below the knees.
  - Drive your hips forward to stand back up, squeezing your glutes.
tips:
  - Keep your back flat; stop the descent before it starts to round.
