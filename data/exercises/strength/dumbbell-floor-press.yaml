name: Dumbbell Floor Press
type: strength
prescription: 3 sets of 10 reps
minutes: 6
muscles: [chest, triceps, shoulders]
equipment: [dumbbells]
steps:
  - Lie on your back with knees bent, holding a dumbbell in each hand.
  - Rest your upper arms on the floor at about 45 degrees from your body, dumbbells above your elbows.
  - Press both dumbbells straight up until your arms are extended over your chest.
  - Lower them slowly until your upper arms touch the floor.
  - Pause for a moment, then press again.
