name: Chair Dip
type: strength
prescription: 3 sets of 10-15 reps
minutes: 5
muscles: [triceps, chest, shoulders]
equipment: [sturdy chair]
steps:
  - Sit on the edge of a sturdy chair and place your hands beside your hips, fingers pointing forward.
  - Walk your feet out and slide your hips off the chair, supporting yourself on your arms.
  - Bend your elbows straight back to lower your hips toward the floor.
  - Stop when your upper arms are about parallel to the floor.
  - Press through your palms to straighten your arms.
tips:
  - Bend your knees to make it easier; straighten your legs to make it harder.
