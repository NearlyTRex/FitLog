name: Dumbbell Overhead Press
type: strength
prescription: 3 sets of 8-10 reps
minutes: 6
muscles: [shoulders, triceps, upper chest]
equipment: [dumbbells]
steps:
  - Stand with feet hip width apart and hold the dumbbells at shoulder height, palms facing forward.
  - Brace your core and squeeze your glutes so your lower back does not arch.
  - Press the dumbbells straight up until your arms are fully extended overhead.
  - Pause briefly with the weights over your shoulders.
  - Lower them back to shoulder height under control.
