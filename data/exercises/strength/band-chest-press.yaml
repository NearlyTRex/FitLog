name: Band Chest Press
type: strength
prescription: 3 sets of 12 reps
minutes: 6
muscles: [chest, triceps, shoulders]
equipment: [resistance band]
steps:
  - Wrap the band around your upper back and hold an end in each hand at chest height.
  - Stand with one foot slightly in front of the other.
  - Press both hands straight out in front of you until your arms are extended.
  - Return slowly to chest height.
