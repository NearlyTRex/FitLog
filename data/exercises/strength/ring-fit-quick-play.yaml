name: "Ring Fit Adventure: Quick Play Set"
type: strength
prescription: 1-2 sets
minutes: 15
muscles: [arms, abs, legs]
equipment: [Nintendo Switch, Ring-Con, Leg Strap]
steps:
  - Put the Joy-Cons in the Ring-Con and the Leg Strap, with the strap on your left thigh.
  - Open Quick Play.
  - Choose a set exercise focused on arms, abs, or legs, or build a custom set.
  - Work through the set, matching the on-screen form.
  - Do the stretches at the end.
