name: Wall Squats
type: strength
prescription: 5 holds of 30 seconds
minutes: 5
muscles: [quads, glutes]
equipment: [wall]
steps:
  - Stand with your back flat against a wall and walk your feet out about two feet.
  - Slide down until you are in a seated position, like sitting in a chair.
  - Keep your knees over your ankles.
  - Hold for a 30 second count.
  - Slide back up and rest before the next hold.
