name: Front Lift (Kettlebell)
type: strength
prescription: 3 sets of 15 reps
minutes: 6
muscles: [front shoulders]
equipment: [kettlebell]
steps:
  - Stand tall holding the ball of the kettlebell in both hands at your belly button.
  - Keep your arms nearly straight and your core tight.
  - Lift the kettlebell up in front of you to nose level.
  - Lower it slowly back to your belly button.
tips:
  - Don't lean back to swing it up; lighten the weight if you have to.
