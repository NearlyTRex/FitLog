name: Reverse Lunge
type: strength
prescription: 3 sets of 10 reps per leg
minutes: 8
muscles: [quads, glutes, hamstrings]
equipment: [dumbbells (optional)]
steps:
  - Stand tall with feet hip width apart, holding dumbbells at your sides if using them.
  - Step one foot back about two feet and lower your back knee toward the floor.
  - Keep your front shin roughly vertical and your torso upright.
  - Stop just before the back knee touches down.
  - Push through the front heel to step back to standing, then repeat on the same leg or alternate.
