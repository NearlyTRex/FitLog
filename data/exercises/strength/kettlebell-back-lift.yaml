name: Back Lift (Kettlebell)
type: strength
prescription: 3 sets of 15 reps
minutes: 6
muscles: [triceps]
equipment: [kettlebell]
steps:
  - Stand tall and hold the ball of the kettlebell in both hands behind your head, elbows pointing up.
  - Keep your upper arms close to your head.
  - Straighten your arms to raise the kettlebell above the back of your head.
  - Lower it slowly back behind your head.
