name: Seated Leg Extension (Ankle Weights)
type: strength
prescription: 3 sets of 15 reps per leg
minutes: 6
muscles: [quads]
equipment: [ankle weights, sturdy chair]
steps:
  - Strap on the ankle weights and sit tall on a sturdy chair, feet flat.
  - Hold the sides of the seat.
  - Straighten one leg until it is level with the seat.
  - Hold for a second, then lower it slowly.
  - Finish the set, then switch legs.
