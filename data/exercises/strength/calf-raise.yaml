name: Standing Calf Raise
type: strength
prescription: 3 sets of 15-20 reps
minutes: 5
muscles: [calves]
equipment: [step (optional)]
steps:
  - Stand with the balls of your feet on the edge of a step, heels hanging off. Hold a rail for balance.
  - Lower your heels below the step until you feel a stretch in your calves.
  - Rise up onto your toes as high as you can.
  - Hold the top for one second.
  - Lower slowly back to the stretch.
