name: Donkey Kicks (Ankle Weights)
type: strength
prescription: 3 sets of 15 reps per leg
minutes: 6
muscles: [glutes, hamstrings]
equipment: [ankle weights, yoga mat]
steps:
  - Strap on the ankle weights and get on hands and knees on the mat.
  - Keep one knee bent at 90 degrees and lift that foot toward the ceiling.
  - Stop when your thigh is level with your body, squeezing your glute.
  - Lower the knee back down without touching the floor.
  - Finish the set, then switch legs.
tips:
  - Keep your back flat; don't arch to lift higher.
