name: Band Pull-Apart
type: strength
prescription: 3 sets of 15 reps
minutes: 5
muscles: [upper back, rear shoulders]
equipment: [resistance band]
steps:
  - Stand tall holding a band in front of your chest with both hands, arms straight, hands shoulder width apart.
  - Pull the band apart by moving your hands out to your sides.
  - Squeeze your shoulder blades together when the band touches your chest.
  - Return slowly to the start without letting the band go slack.
