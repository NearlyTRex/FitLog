name: Side-Lying Leg Raise (Ankle Weights)
type: strength
prescription: 3 sets of 15 reps per leg
minutes: 6
muscles: [outer hips, glutes]
equipment: [ankle weights, yoga mat]
steps:
  - Strap on the ankle weights and lie on your side on the mat, legs straight and stacked.
  - Rest your head on your lower arm.
  - Lift your top leg to about 45 degrees, toes pointing forward.
  - Lower it slowly back down.
  - Finish the set, then roll over and switch legs.
