name: Bulgarian Split Squat
type: strength
prescription: 3 sets of 8 reps per leg
minutes: 8
muscles: [quads, glutes]
equipment: [sturdy chair, dumbbells (optional)]
steps:
  - Stand about two feet in front of a sturdy chair, facing away from it.
  - Rest the top of one foot on the chair seat behind you.
  - Lower straight down by bending your front knee until your back knee nearly touches the floor.
  - Keep most of your weight on the front foot and your torso upright.
  - Drive through your front foot to rise back up. Finish all reps, then switch legs.
tips:
  - Adjust how far your front foot is from the chair until your front knee stays over your foot.
