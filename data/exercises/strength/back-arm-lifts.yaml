name: Back Arm Lifts
type: strength
prescription: 3 sets of 15 reps
minutes: 6
muscles: [triceps, rear shoulders]
equipment: [dumbbells]
steps:
  - Stand with legs apart and knees slightly bent, a dumbbell in each hand at your hips.
  - Bend your elbows slightly and keep them bent.
  - Move the weights back from your hips to about 8 inches behind you.
  - Squeeze the backs of your arms at the end of the movement.
  - Bring the weights back to your hips under control.
