name: Kettlebell Swing
type: strength
prescription: 4 sets of 15 reps
minutes: 8
muscles: [glutes, hamstrings, core]
equipment: [kettlebell]
steps:
  - Stand with feet a little wider than your hips, the kettlebell on the floor a foot in front of you.
  - Hinge at the hips, grab the handle with both hands, and hike it back between your legs.
  - Snap your hips forward to stand tall, letting the kettlebell float up to chest height.
  - Let it fall back between your legs as you hinge again.
  - Keep the rhythm going for the whole set, then park it back on the floor.
tips:
  - The power comes from your hips; your arms just guide the bell.
