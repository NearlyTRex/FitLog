name: Seated Band Row
type: strength
prescription: 3 sets of 12 reps
minutes: 6
muscles: [upper back, lats, biceps]
equipment: [resistance band, yoga mat]
steps:
  - Sit on the mat with legs straight and loop the band around the soles of your feet.
  - Hold an end in each hand, arms straight, sitting tall.
  - Pull your hands toward your lower ribs, leading with your elbows.
  - Squeeze your shoulder blades together at the end.
  - Straighten your arms slowly to return.
