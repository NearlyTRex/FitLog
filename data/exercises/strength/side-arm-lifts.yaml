name: Side Arm Lifts (Lateral Raise)
type: strength
prescription: 3 sets of 15 reps
minutes: 6
muscles: [shoulders]
equipment: [dumbbells]
steps:
  - Stand with legs apart and knees slightly bent, a dumbbell in each hand at your sides.
  - Keep a slight bend in your elbows.
  - Lift the weights out to your sides until they are just below shoulder height.
  - Pause for a moment.
  - Lower slowly back to your sides.
