name: Push-Up
type: strength
prescription: 3 sets of as many clean reps as you can
minutes: 6
muscles: [chest, shoulders, triceps, core]
steps:
  - Place your hands on the floor slightly wider than shoulder width.
  - Step your feet back into a straight line from head to heels.
  - Brace your core and glutes so your hips do not sag.
  - Bend your elbows to about 45 degrees from your body and lower your chest toward the floor.
  - Press the floor away to return to the top with your arms straight.
tips:
  - Too hard? Put your hands on a counter or sturdy chair.
  - Too easy? Slow the lowering to three seconds.
