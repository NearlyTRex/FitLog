name: Step-Up
type: strength
prescription: 3 sets of 10 reps per leg
minutes: 8
muscles: [quads, glutes]
equipment: [stair or sturdy box]
steps:
  - Stand facing a stair or a sturdy box about knee height.
  - Place one foot fully on top of the box.
  - Press through that foot to stand up on the box, bringing the other foot up to meet it.
  - Step back down with the trailing foot first, then the lead foot.
  - Finish all reps on one side, then switch.
tips:
  - Avoid pushing off the floor leg; let the top leg do the work.
