name: Bent-Over Dumbbell Row
type: strength
prescription: 3 sets of 10-12 reps
minutes: 6
muscles: [upper back, lats, biceps]
equipment: [dumbbells]
steps:
  - Hold a dumbbell in each hand and hinge forward at the hips until your torso is about 45 degrees.
  - Let the dumbbells hang straight down with your arms long.
  - Pull the dumbbells toward your lower ribs, leading with your elbows.
  - Squeeze your shoulder blades together at the top for a moment.
  - Lower the weights under control until your arms are straight again.
tips:
  - Keep your neck in line with your spine; look at the floor a little ahead of you.
