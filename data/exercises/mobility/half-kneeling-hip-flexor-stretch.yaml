name: Half-Kneeling Hip Flexor Stretch
type: mobility
prescription: 2 holds of 45 seconds per side
minutes: 4
muscles: [hip flexors, quads]
equipment: [pad for your knee]
steps:
  - Kneel on your right knee with your left foot flat on the floor in front of you.
  - Tuck your pelvis under by squeezing your right glute.
  - Shift your hips gently forward until you feel a stretch in the front of your right hip.
  - Reach your right arm overhead to deepen the stretch.
  - Hold, then switch sides.
