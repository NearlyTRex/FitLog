name: 90/90 Hip Switch
type: mobility
prescription: 10 switches
minutes: 4
muscles: [hips]
steps:
  - Sit on the floor with both knees bent to 90 degrees, one leg in front of you and one to the side.
  - Sit up tall, using your hands behind you for support if needed.
  - Lift both knees and rotate them to the other side, ending in the mirrored position.
  - Pause and sit tall in the new position.
  - Keep switching back and forth slowly.
