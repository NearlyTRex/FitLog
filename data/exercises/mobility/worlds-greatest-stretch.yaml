name: "World's Greatest Stretch"
type: mobility
prescription: 5 reps per side
minutes: 5
muscles: [hips, hamstrings, upper back]
steps:
  - Step forward into a long lunge with your right foot and place both hands on the floor inside it.
  - Drop your right elbow toward the inside of your right ankle.
  - Rotate your torso and reach your right arm up toward the ceiling, following your hand with your eyes.
  - Bring your hand back down, then shift your hips back to straighten the front leg for a hamstring stretch.
  - Return to the lunge and repeat, then switch sides.
