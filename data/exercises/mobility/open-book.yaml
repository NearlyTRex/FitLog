name: Thoracic Open Book
type: mobility
prescription: 8 reps per side
minutes: 4
muscles: [upper back, chest]
steps:
  - Lie on your left side with knees bent to 90 degrees and arms straight out in front, palms together.
  - Keep your knees stacked and touching the floor.
  - Lift your top arm and open it across your body, rotating your chest toward the ceiling.
  - Follow your hand with your eyes and let the arm drop toward the floor on the other side.
  - Return slowly and repeat, then switch sides.
