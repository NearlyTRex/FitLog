name: Cat-Cow
type: mobility
prescription: 10 slow reps
minutes: 3
muscles: [spine]
steps:
  - Start on hands and knees, wrists under shoulders and knees under hips.
  - Inhale as you drop your belly, lift your chest, and look slightly up (cow).
  - Exhale as you round your back toward the ceiling and tuck your chin (cat).
  - Move slowly between the two positions with your breath.
  - Repeat for the prescribed reps.
