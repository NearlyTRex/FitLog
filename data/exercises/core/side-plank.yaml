name: Side Plank
type: core
prescription: 2 holds of 20-40 seconds per side
minutes: 5
muscles: [obliques, shoulders, hips]
steps:
  - Lie on your side with your elbow directly under your shoulder.
  - Stack your feet on top of each other, or stagger them for more stability.
  - Lift your hips so your body forms a straight line from head to feet.
  - Hold without letting your hips drop.
  - Lower down and switch sides.
tips:
  - Bend your bottom knee and rest it on the floor to make it easier.
