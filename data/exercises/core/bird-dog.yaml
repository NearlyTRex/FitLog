name: Bird Dog
type: core
prescription: 3 sets of 8 reps per side
minutes: 5
muscles: [lower back, glutes, abs]
steps:
  - Start on hands and knees, wrists under shoulders and knees under hips.
  - Brace your core so your back stays flat.
  - Reach one arm forward and the opposite leg straight back until both are level with your body.
  - Hold for two seconds without rotating your hips.
  - Return to the start and switch sides.
