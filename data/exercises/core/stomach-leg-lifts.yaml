name: Stomach Leg Lifts
type: core
prescription: 3 sets of 10 reps
minutes: 5
muscles: [lower abs, hip flexors]
equipment: [yoga mat]
steps:
  - Lie on your back on the yoga mat with your legs straight.
  - Press your lower back into the mat.
  - Lift both legs 3-6 inches off the floor.
  - Hold briefly, then lower them back down slowly.
