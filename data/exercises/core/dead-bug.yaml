name: Dead Bug
type: core
prescription: 3 sets of 8 reps per side
minutes: 5
muscles: [abs, hip flexors]
steps:
  - Lie on your back with arms reaching toward the ceiling.
  - Lift your legs so your knees are bent at 90 degrees over your hips.
  - Press your lower back into the floor.
  - Slowly extend your right arm overhead and your left leg straight out, just above the floor.
  - Return to the start and repeat with the opposite arm and leg.
tips:
  - Move slowly; if your lower back lifts off the floor, shorten the reach.
