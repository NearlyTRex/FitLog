name: Hollow Body Hold
type: core
prescription: 3 holds of 20-30 seconds
minutes: 5
muscles: [abs]
steps:
  - Lie on your back with arms overhead and legs straight.
  - Press your lower back firmly into the floor.
  - Lift your shoulders, arms, and legs a few inches off the floor.
  - Hold the shallow banana shape while breathing steadily.
  - Lower everything back down when time is up.
tips:
  - Bend your knees or bring your arms to your sides to make it easier.
