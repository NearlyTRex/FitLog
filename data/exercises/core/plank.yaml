name: Plank
type: core
prescription: 5 holds of 30 seconds
minutes: 5
muscles: [abs, shoulders, glutes]
equipment: [yoga mat, sneakers]
steps:
  - Put on sneakers and set out the yoga mat for grip.
  - Place your forearms on the mat with elbows under your shoulders.
  - Step your feet back so your body forms a straight line from head to heels.
  - Squeeze your glutes and hold for a 30 second count.
  - Lower your knees and rest before the next hold.
tips:
  - Don't let your hips sag or pike up.
