name: Side Kettlebell Twists
type: core
prescription: 3 sets of 15 reps per side
minutes: 8
muscles: [obliques, abs]
equipment: [kettlebell]
steps:
  - Stand with feet apart, holding the kettlebell at your belly button.
  - Twist your torso to one side until your elbow faces behind you.
  - Return to center.
  - Twist to the other side.
  - Keep your hips facing forward throughout.
