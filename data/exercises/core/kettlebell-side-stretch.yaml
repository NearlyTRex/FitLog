name: Kettlebell Side Stretches
type: core
prescription: 3 sets of 15 reps per side
minutes: 8
muscles: [obliques]
equipment: [kettlebell]
steps:
  - Stand with legs apart and knees bent, the kettlebell in one hand at your hip.
  - Slightly bend your elbow.
  - Lean sideways and slide the kettlebell down from your hip toward your knee.
  - Come back up to standing.
  - Finish the set, then switch hands.
