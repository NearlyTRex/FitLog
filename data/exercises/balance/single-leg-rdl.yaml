name: Single-Leg Romanian Deadlift
type: balance
prescription: 3 sets of 8 reps per leg
minutes: 6
muscles: [hamstrings, glutes, ankles]
equipment: [dumbbell (optional)]
steps:
  - Stand on your right leg with a slight bend in the knee.
  - Hinge forward at the hips while your left leg extends straight back.
  - Reach your hands toward the floor, keeping your back flat and hips square.
  - Lower until your torso and back leg are close to parallel with the floor.
  - Drive your hips forward to return to standing. Finish the set, then switch legs.
