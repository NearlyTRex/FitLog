name: "Wii Fit Plus: Balance Games"
type: balance
prescription: 15 minutes
minutes: 15
muscles: [ankles, core]
equipment: [Wii, Balance Board]
steps:
  - Start Wii Fit Plus (or Wii Fit) and load your profile on the Balance Board.
  - Open Balance Games.
  - Play a few different games, such as Soccer Heading, Ski Slalom, and Table Tilt.
  - Stand tall and shift your weight with your ankles and hips, not by leaning at the waist.
  - Replay the ones you score lowest on.
