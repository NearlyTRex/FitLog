name: Single-Leg Stand
type: balance
prescription: 3 holds of 30 seconds per leg
minutes: 4
muscles: [ankles, hips]
steps:
  - Stand near a wall or counter for safety.
  - Shift your weight onto one foot and lift the other foot off the floor.
  - Keep your standing knee soft and your hips level.
  - Hold the position, fixing your eyes on a point ahead of you.
  - Switch legs. Close your eyes to make it harder.
