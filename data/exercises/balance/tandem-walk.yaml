name: Heel-to-Toe Walk
type: balance
prescription: 3 passes of 20 steps
minutes: 4
muscles: [ankles, core]
steps:
  - Stand next to a wall or along a hallway.
  - Place one foot directly in front of the other so the heel touches the toes.
  - Step forward, placing the back foot heel-to-toe in front.
  - Keep your eyes forward and arms out to the side if needed.
  - Walk 20 steps, turn around, and repeat.
