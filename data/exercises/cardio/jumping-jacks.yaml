name: Jumping Jacks
type: cardio
prescription: "4 rounds of 45 seconds on, 15 seconds rest"
minutes: 4
muscles: [full body, heart]
steps:
  - Stand tall with feet together and arms at your sides.
  - Jump your feet out wider than your hips while raising your arms overhead.
  - Jump your feet back together while bringing your arms down.
  - Keep a steady rhythm and land softly on the balls of your feet.
  - Rest between rounds.
tips:
  - "Low-impact option: step one foot out at a time instead of jumping."
