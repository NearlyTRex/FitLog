name: EA Sports Active Workout
type: cardio
prescription: 20-30 minute workout
minutes: 30
muscles: [full body, heart]
equipment: [Wii, Wii Remote and Nunchuk, leg strap, resistance band]
steps:
  - "Start EA Sports Active, Active: More Workouts, or Active 2."
  - Put the Nunchuk in the leg strap and have the resistance band nearby.
  - Pick a preset workout of 20-30 minutes, or continue your 30-day challenge.
  - Follow the trainer through each exercise, matching the on-screen form.
  - Do the cooldown at the end.
