name: Fitness Boxing Daily Workout
type: cardio
prescription: 20-30 minutes
minutes: 25
muscles: [arms, shoulders, core, heart]
equipment: [Nintendo Switch, 2 Joy-Con]
steps:
  - Start Fitness Boxing or Fitness Boxing 2.
  - Put the wrist straps on and hold a Joy-Con in each hand.
  - Choose the daily workout and set it to 20-30 minutes.
  - Stand in a boxing stance with knees soft, and punch in time with the music.
  - Finish with the game's stretches.
