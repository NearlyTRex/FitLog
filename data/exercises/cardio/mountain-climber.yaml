name: Mountain Climbers
type: cardio
prescription: "4 rounds of 30 seconds on, 30 seconds rest"
minutes: 4
muscles: [core, shoulders, heart]
steps:
  - Start in a high plank with hands under your shoulders.
  - Drive one knee toward your chest.
  - Quickly switch legs, bringing the other knee in as the first leg goes back.
  - Keep your hips level and your core tight.
  - Continue alternating at a fast pace for the round.
