name: Jump Rope Challenge
type: cardio
prescription: Daily goal plus 2 extra rounds
minutes: 10
muscles: [calves, heart]
equipment: [Nintendo Switch, 2 Joy-Con]
steps:
  - Start Jump Rope Challenge.
  - Hold a Joy-Con in each hand with the wrist straps on.
  - Jump in place, turning your wrists as if you were swinging a rope.
  - Keep going until you reach the daily jump goal.
  - Do two more rounds after the goal, resting briefly between them.
tips:
  - Land softly on the balls of your feet; wear shoes on a hard floor.
