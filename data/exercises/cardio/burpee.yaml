name: Burpee
type: cardio
prescription: 4 sets of 8 reps
minutes: 6
muscles: [full body, heart]
steps:
  - Stand with feet shoulder width apart.
  - Squat down and place your hands on the floor in front of you.
  - Jump or step your feet back into a push-up position.
  - Jump or step your feet back toward your hands.
  - Stand up and jump, reaching your arms overhead.
tips:
  - Add a push-up at the bottom for more challenge.
