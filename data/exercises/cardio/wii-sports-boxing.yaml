name: "Wii Sports: Boxing and Tennis"
type: cardio
prescription: 20 minutes
minutes: 20
muscles: [arms, shoulders, heart]
equipment: [Wii, Wii Remote and Nunchuk]
steps:
  - Start Wii Sports and stand up with room to swing.
  - Play several Boxing bouts, keeping your guard up and moving your feet.
  - Switch to Tennis and play a few matches, swinging fully and stepping into each shot.
  - Keep going for about 20 minutes with only short breaks.
