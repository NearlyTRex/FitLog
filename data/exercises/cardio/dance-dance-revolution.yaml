name: Dance Dance Revolution
type: cardio
prescription: 20-30 minutes
minutes: 25
muscles: [legs, heart]
equipment: [dance pad, PS2 or Wii]
steps:
  - "Set out the dance pad and start any DDR: Extreme, Extreme 2, SuperNova, X, MAX, or MAX2 on PS2, or DDR on Wii."
  - Turn on the game's workout mode if it has one.
  - Warm up with two or three easy songs.
  - Play songs at a difficulty where you can keep moving without stopping for 20-30 minutes.
  - Cool down with an easy song.
tips:
  - Dance Factory on PS2 makes step charts from your own music CDs, for a change of songs.
