name: "Ring Fit Adventure: Adventure Mode"
type: cardio
prescription: 30 minutes
minutes: 30
muscles: [full body, heart]
equipment: [Nintendo Switch, Ring-Con, Leg Strap]
steps:
  - Slide the right Joy-Con into the Ring-Con and the left Joy-Con into the Leg Strap.
  - Strap the Leg Strap onto your left thigh.
  - Start Adventure Mode and pick up where you left off.
  - Play for about 30 minutes, using the attack skills the game gives you.
  - Finish with the cooldown stretches the game offers at the end.
tips:
  - If the last few reps of each skill feel easy, raise the exercise load in the settings.
