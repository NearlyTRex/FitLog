name: High Knees
type: cardio
prescription: "4 rounds of 30 seconds on, 30 seconds rest"
minutes: 4
muscles: [hip flexors, legs, heart]
steps:
  - Stand with feet hip width apart.
  - Run in place, driving each knee up toward hip height.
  - Pump your arms in time with your legs.
  - Stay on the balls of your feet and keep your chest up.
  - Rest between rounds.
