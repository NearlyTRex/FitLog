name: Just Dance Session
type: cardio
prescription: 6-8 songs back to back
minutes: 25
muscles: [full body, heart]
equipment: [Nintendo Switch or Wii]
steps:
  - "Pick any Just Dance: 2019-2022 on Switch, or Just Dance 1, 2, 3, or Summer Party on Wii."
  - Hold the Joy-Con or Wii Remote in your right hand with the wrist strap on.
  - Clear some floor space in front of the screen.
  - Dance 6-8 songs back to back, mixing in a few high-energy tracks.
  - Finish with a slow song or a couple of minutes of walking to cool down.
