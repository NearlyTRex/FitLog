name: Brisk Walk
type: cardio
prescription: 20-30 minutes
minutes: 25
muscles: [legs, heart]
equipment: [comfortable shoes]
steps:
  - Start with five minutes at an easy pace to warm up.
  - Pick up the pace until you are breathing harder but can still talk in short sentences.
  - Swing your arms naturally and take quick, even steps.
  - Hold that pace for the main part of the walk.
  - Slow down for the last few minutes to cool down.
