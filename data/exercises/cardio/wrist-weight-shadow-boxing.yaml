name: Shadow Boxing (Wrist Weights)
type: cardio
prescription: "5 rounds of 1 minute on, 1 minute rest"
minutes: 10
muscles: [arms, shoulders, core, heart]
equipment: [wrist weights]
steps:
  - Strap on the wrist weights and stand in a boxing stance, knees soft.
  - Throw steady jabs and crosses, turning your hips with each punch.
  - Mix in hooks and uppercuts, keeping your hands up between punches.
  - Keep moving your feet for the whole minute.
  - Rest a minute between rounds.
tips:
  - Don't snap your elbows straight; stop each punch just short of full extension.
